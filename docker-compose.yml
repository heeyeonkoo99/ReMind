services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env                     # API keys go into the container
    environment:
      WATCHFILES_FORCE_POLLING: "true" # so --reload sees edits on Windows
    volumes:                           # edit locally, takes effect in the container
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules              # keep the container's node_modules
    depends_on: [api]
